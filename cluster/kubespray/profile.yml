# Профиль кластера: одинаковый и для установки с интернетом, и без него.
#
# Лежит отдельным файлом, а не внутри deploy.sh, потому что этот же профиль
# читает cluster/offline/collect.sh: он по нему считает, какие файлы и образы
# нужно принести в контур. Разъедься эти два места, и сбор принесёт не то,
# что потом попросит установка.

# Домен кластера намеренно оставлен стандартным (cluster.local): своё имя
# ломает любые манифесты с полными именами служб.

# kubeadm-кластер, в отличие от k3s, не приносит с собой хранилище:
# без этого PVC висит без класса и ничего не стартует.
local_path_provisioner_enabled: true
local_path_provisioner_is_default_storageclass: "true"

# Стенд скромный по ресурсам, лишнее не ставим.
dashboard_enabled: false
metrics_server_enabled: false
helm_enabled: false
kube_network_plugin: calico

# ───────────────────────── управление кластером ─────────────────────────
#
# 🔴 Управляющих узлов ТРИ, а не два. Второй узел сам по себе не даёт
# отказоустойчивости, а отбирает её: у etcd из двух членов большинство это
# два голоса, поэтому потеря любого узла останавливает кластер. С тремя
# членами большинство это два, и один узел можно потерять безболезненно.
# Правило простое: живых членов должно быть больше половины, а половина от
# двух это один, и «больше» уже не набирается.
#
# Узлы у нас совмещённые: они же несут нагрузку. Для стенда из трёх машин
# это единственный вариант, на площадке управляющие обычно отделяют.

# Единый адрес для обращения к API. Без него kubeconfig указывает на один
# конкретный узел, и его потеря лишает управления, сколько бы управляющих
# узлов ни стояло рядом. kube-vip держит адрес на том узле, который сейчас
# лидер, и переносит его при отказе.
kube_vip_enabled: true
kube_vip_controlplane_enabled: true
kube_vip_arp_enabled: true
kube_vip_address: 192.168.200.250
kube_vip_interface: ens3
loadbalancer_apiserver:
  address: 192.168.200.250
  port: 6443

# ⚠️ Обязательно при kube-proxy в режиме ipvs: без строгого ARP объявление
# адреса не работает, и Kubespray останавливает установку с этой же мыслью.
kube_proxy_strict_arp: true

# Сертификат API должен знать про общий адрес, иначе обращение к нему
# отвергается как к чужому имени.
supplementary_addresses_in_ssl_keys:
  - 192.168.200.250
