# Профиль кластера: одинаковый и для установки с интернетом, и без него.
#
# Лежит отдельным файлом, а не внутри deploy.sh, потому что этот же профиль
# читает cluster/offline/collect.sh: он по нему считает, какие файлы и образы
# нужно принести в контур. Разъедься эти два места, и сбор принесёт не то,
# что потом попросит установка.

# Домен кластера намеренно оставлен стандартным (cluster.local): своё имя
# ломает любые манифесты с полными именами служб.

# kubeadm-кластер, в отличие от k3s, не приносит с собой хранилище:
# без этого PVC висит без класса и ничего не стартует.
local_path_provisioner_enabled: true
local_path_provisioner_is_default_storageclass: "true"

# Стенд скромный по ресурсам, лишнее не ставим.
dashboard_enabled: false
metrics_server_enabled: false
helm_enabled: false
kube_network_plugin: calico
