# Сетевые политики нагрузки карьера: кто к кому может подключиться.
#
# Периметр контура закрыт снаружи: сеть изолирована, с узлов нет ни пинга, ни
# DNS, ни HTTPS. Внутри же сеть подов оставалась плоской, и до базы журнала
# мог достучаться любой под кластера. На площадке это и есть типичный путь
# после проникновения: попали в один под, дальше идут по открытым портам.
#
# ЗАХОД ПЕРВЫЙ: только входящий трафик, то есть «кого пускать к этому поду».
# Исходящий пока свободен и закрывается отдельно, чтобы ошибка в одном не
# уронила сразу всё.
#
# 🔴 Трафик с управляющей машины приходит НЕ от пода. `kubectl port-forward`
# открывает соединение от kubelet с адреса узла, NodePort тоже приходит после
# подмены адреса. Политика вида «пускать только от Prometheus» закрыла бы
# экраны, и выглядело бы это как зависшая страница без единой ошибки в логах.
# Поэтому у каждого экрана есть отдельное правило на сеть контура.
#
# ⚠️ Тома NFS монтирует kubelet на узле, а не под: хранилище этими правилами
# не закрывается и ими же не ломается.
#
# ⚠️ Поды в сети узла (apiserver, kube-proxy, calico-node, kube-vip) политикам
# не подчиняются вовсе. «Закрыть всё внутри кластера» невозможно, и делать
# вид, что закрыли, хуже, чем знать границу.

---
# Запрет по умолчанию. Дальше идут точечные разрешения; правила складываются,
# поэтому под открыт ровно настолько, насколько его открыли явно.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-vhodyashchiy
  namespace: quarry
spec:
  podSelector: {}
  policyTypes: [Ingress]

---
# Шина: пишут симуляторы и приёмный шлюз, читает приёмник. Больше никто.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-vhod
  namespace: quarry
spec:
  podSelector:
    matchLabels: { app: kafka }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { part: sim }
        - podSelector:
            matchLabels: { app: egts-gateway }
        - podSelector:
            matchLabels: { app: collector }
      ports:
        - { protocol: TCP, port: 9092 }

---
# Журнал смены: пишет приёмник, читает Grafana для отчёта. Это та дверь,
# ради которой всё и затевалось.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-vhod
  namespace: quarry
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: collector }
        - podSelector:
            matchLabels: { app: grafana }
      ports:
        - { protocol: TCP, port: 5432 }

---
# Приёмный шлюз: телеметрия по EGTS от бортов, показатели снимает Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egts-gateway-vhod
  namespace: quarry
spec:
  podSelector:
    matchLabels: { app: egts-gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { part: sim }
      ports:
        # Два порта, два протокола: EGTS по ГОСТ и Wialon IPS.
        - { protocol: TCP, port: 7777 }
        - { protocol: TCP, port: 7778 }
    - from:
        - podSelector:
            matchLabels: { app: prometheus }
      ports:
        - { protocol: TCP, port: 8090 }

---
# Приёмник: показатели снимает Prometheus, тревоги приносит Alertmanager.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collector-vhod
  namespace: quarry
spec:
  podSelector:
    matchLabels: { app: collector }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: prometheus }
      ports:
        - { protocol: TCP, port: 8000 }
    - from:
        - podSelector:
            matchLabels: { app: alertmanager }
      ports:
        - { protocol: TCP, port: 8001 }

---
# Экраны: к ним ходит человек с управляющей машины, поэтому кроме соседей по
# кластеру разрешена сеть контура. Адреса подов (10.233.0.0/16) в неё не
# входят, так что посторонний под сюда всё равно не попадёт.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-vhod
  namespace: quarry
spec:
  podSelector:
    matchLabels: { app: prometheus }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: grafana }
        - ipBlock: { cidr: 192.168.200.0/24 }
      ports:
        - { protocol: TCP, port: 9090 }

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-vhod
  namespace: quarry
spec:
  podSelector:
    matchLabels: { app: grafana }
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 192.168.200.0/24 }
      ports:
        - { protocol: TCP, port: 3000 }

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-vhod
  namespace: quarry
spec:
  podSelector:
    matchLabels: { app: alertmanager }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: prometheus }
        - ipBlock: { cidr: 192.168.200.0/24 }
      ports:
        - { protocol: TCP, port: 9093 }

---
# Управление парками: обрыв связи устраивается руками с управляющей машины,
# это часть учений, а не забытая дверь.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sim-vhod
  namespace: quarry
spec:
  podSelector:
    matchLabels: { part: sim }
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 192.168.200.0/24 }
      ports:
        - { protocol: TCP, port: 8080 }
