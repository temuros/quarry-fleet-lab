apiVersion: v1
kind: Namespace
metadata:
  name: quarry
---
# Kafka в одном экземпляре, режим KRaft: для стенда этого достаточно,
# а на площадке вместо этого встанет кластер заказчика.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: quarry
spec:
  clusterIP: None
  # Kafka обращается к себе по собственному имени, а имя пода у безголового
  # сервиса публикуется только когда под готов. Без этой строки брокер
  # не может стать готовым, потому что не разрешает сам себя.
  publishNotReadyAddresses: true
  selector: { app: kafka }
  ports:
    - name: broker
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: quarry
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: registry.quarry.local:5000/mirror/kafka:3.8.1
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka:9093
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24"
            # 🔴 Без этого образ apache/kafka кладёт журналы разделов в
            # /tmp/kafka-logs, а смонтированный том стоит пустой. Пока под не
            # пересоздавался, всё выглядит исправно: данные на месте, том
            # подключён, PVC Bound. Первый же перезапуск стирает шину целиком.
            # Вскрылось на учении с обрывом питания: после подъёма смещения
            # топиков оказались нулевыми, а /var/lib/kafka/data занимал 4 КБ.
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: CLUSTER_ID
              value: wqiL2YOzQPS9r4Hd0Czk6A
          # 🔴 Проба проверяет порт, а не запускает kafka-topics.sh. Прежняя
          # проба поднимала JVM на каждую проверку и занимала 24 секунды при
          # таймауте 10: под работал, данные шли, а кластер считал его
          # неготовым и не пускал в службу. Проба должна стоить дешевле того,
          # что она проверяет, иначе она сама становится причиной отказа.
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1400Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Топики создаются заранее: приёмник, подписавшийся раньше появления топика,
# молча остаётся без событий. Эту грабли стенд уже собрал в docker compose.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: quarry
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: registry.quarry.local:5000/mirror/kafka:3.8.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-0.kafka:9092 --list; do
                echo "жду брокер"; sleep 5
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-0.kafka:9092 \
                --create --if-not-exists --topic quarry.telemetry --partitions 3 --replication-factor 1 --config retention.ms=3600000
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-0.kafka:9092 \
                --create --if-not-exists --topic quarry.events --partitions 3 --replication-factor 1 --config retention.ms=86400000
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-0.kafka:9092 --list
