# Полезная нагрузка: приёмник телеметрии и два парка самосвалов.
# Образы тянутся из реестра ВНУТРИ контура, наружу никто не ходит.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: quarry
spec:
  replicas: 1
  selector:
    matchLabels: { app: collector }
  template:
    metadata:
      labels: { app: collector }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: collector
          image: registry.quarry.local:5000/quarry/collector:local
          # 🔴 Тег :local не меняется от сборки к сборке, а Kubernetes по
          # умолчанию не перекачивает образ, который уже есть на узле. Без
          # этой строки выкат выглядит успешным, а работает прежний код.
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
            - containerPort: 8001
          env:
            - name: KAFKA_BROKER
              value: kafka-0.kafka:9092
            - name: SLA_LAG_SEC
              value: "5"
            - name: PG_DSN
              value: postgresql://quarry:quarry@postgres-0.postgres:5432/quarry
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: quarry
  labels: { app: collector }
spec:
  selector: { app: collector }
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
    # Приём тревог от Alertmanager: они попадают в журнал смены, потому что в
    # разборе смены отказ системы и поломка машины это один вопрос.
    - name: alerts
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-fixed
  namespace: quarry
spec:
  replicas: 1
  selector:
    matchLabels: { app: sim-fixed }
  template:
    metadata:
      labels: { app: sim-fixed, part: sim }
    spec:
      containers:
        - name: sim
          image: registry.quarry.local:5000/quarry/sim:local
          # 🔴 Тег :local не меняется от сборки к сборке, а Kubernetes по
          # умолчанию не перекачивает образ, который уже есть на узле. Без
          # этой строки выкат выглядит успешным, а работает прежний код.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKER
              value: kafka-0.kafka:9092
            # Телеметрия уходит по EGTS через шлюз, события смены по-прежнему
            # в шину: на площадке события формирует система, а не терминал.
            - name: TRANSPORT
              value: egts
            - name: EGTS_HOST
              value: egts-gateway
            - name: EGTS_PORT
              value: "7777"
            - name: DISPATCH
              value: fixed
            - name: FLEET
              value: fixed
            - name: TRUCKS
              value: "8"
            - name: SIM_SPEED
              value: "60"
            - name: OUTAGE_EVERY_MIN
              value: "0"
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sim-fixed
  namespace: quarry
spec:
  selector: { app: sim-fixed }
  ports:
    - port: 8080
      targetPort: 8080
---
