# Шлюз телеметрии: борта говорят с ним по EGTS, по Wialon IPS и подписанными
# заявлениями, он кладёт данные в одну шину.
#
# На площадке это место занимает приёмник телематики, к которому подключаются
# бортовые терминалы техники. Шлюз выделен отдельно от приёмника показателей
# намеренно: протокол на борту меняется, а обработка данных остаётся прежней.
# Три протокола на трёх портах это проверка того же утверждения делом: парк
# fixed говорит по ГОСТ, парк balanced подписанными заявлениями по UDP, в
# журнале смены их записи неразличимы. Wialon IPS слушается тем же шлюзом и
# включается одной переменной у любого парка.
apiVersion: v1
kind: Service
metadata:
  name: egts-gateway
  namespace: quarry
spec:
  selector:
    app: egts-gateway
  ports:
    - name: egts
      port: 7777
      targetPort: 7777
    - name: wialon
      port: 7778
      targetPort: 7778
    # ⚠️ Третий протокол ходит по UDP, и это надо написать явно: по умолчанию
    # Service слушает TCP, а дейтаграммы при этом просто не доходят, не подав
    # признака ошибки.
    - name: statement
      port: 7779
      targetPort: 7779
      protocol: UDP
    - name: metrics
      port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egts-gateway
  namespace: quarry
spec:
  replicas: 1
  selector:
    matchLabels: { app: egts-gateway }
  template:
    metadata:
      labels: { app: egts-gateway }
      annotations:
        # Шлюз отдаёт свои счётчики: сколько пакетов пришло, сколько записей,
        # сколько битых сумм, сколько бортов на связи. Без этого «данные не
        # идут» невозможно разобрать: непонятно, молчит борт или упал приём.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
    spec:
      containers:
        - name: gateway
          image: registry.quarry.local:5000/quarry/egts:local
          # 🔴 Тег :local не меняется от сборки к сборке, а Kubernetes по
          # умолчанию не перекачивает образ, который уже есть на узле. Без
          # этой строки выкат выглядит успешным, а работает прежний код.
          imagePullPolicy: Always
          env:
            - name: KAFKA_BROKER
              value: kafka-0.kafka:9092
            - name: EGTS_PORT
              value: "7777"
            - name: WIALON_PORT
              value: "7778"
            - name: STATEMENT_PORT
              value: "7779"
            - name: METRICS_PORT
              value: "8090"
          ports:
            - containerPort: 7777
            - containerPort: 7778
            - containerPort: 7779
              protocol: UDP
            - containerPort: 8090
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
