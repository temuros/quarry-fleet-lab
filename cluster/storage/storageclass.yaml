# Класс сетевого хранилища.
#
# Том этого класса лежит НЕ на узле, а на хранилище контура, поэтому под с
# таким томом переезжает на любой узел и видит те же файлы. Именно это и
# отличает его от local-path, который привязывает данные к машине.
#
# Класс сделан классом по умолчанию: всё новое должно попадать на сетевое
# хранилище, а привязка к узлу остаётся осознанным исключением.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: quarry-nfs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: nfs.csi.k8s.io
parameters:
  # Общий адрес пары машин хранилища, а не конкретная машина. Какая из двух
  # сейчас обслуживает, кластеру знать не нужно: адрес переезжает вместе с
  # ролью главного.
  server: 192.168.200.251
  share: /srv/quarry-nfs
  # Каждый том получает свой подкаталог с понятным именем: когда на площадке
  # спросят «где лежит журнал смен», ответ должен быть виден в файловой
  # системе, а не только в описании тома.
  subDir: ${pvc.metadata.namespace}-${pvc.metadata.name}
  # 🔴 Права на подкаталог. По умолчанию драйвер создаёт его от root с
  # правами 0755, и контейнер, работающий не от root (а таких большинство),
  # монтирует том и падает на ПЕРВОЙ записи: «Error while writing». Выглядит
  # как поломка приложения, а не хранилища. На площадке это решается
  # отображением пользователей на самой СХД.
  mountPermissions: "0777"
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  # hard, а не soft: при потере связи с хранилищем запись должна ЖДАТЬ его
  # возвращения, а не завершаться ошибкой. База, получившая ошибку записи на
  # середине, разбирается тяжелее, чем база, которая подождала минуту.
  - hard
  - noatime
