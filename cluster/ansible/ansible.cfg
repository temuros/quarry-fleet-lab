# Настройки прогона по стенду.
[defaults]
inventory = inventory/quarry.py
roles_path = roles
host_key_checking = False
# Вывод построчный: в журнале прогона видно, какая задача какую машину меняла.
stdout_callback = yaml
# Факты собираются сами: ролям нужны версия ядра и имя машины.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/quarry-fakty
fact_caching_timeout = 3600
interpreter_python = auto_silent
# Прогон по пяти машинам укладывается в один проход.
forks = 10

[ssh_connection]
# Повторное подключение к той же машине без нового рукопожатия: роль
# хранилища делает много мелких шагов, и без этого прогон вдвое дольше.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=10
