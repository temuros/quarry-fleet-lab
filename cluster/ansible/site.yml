---
# Стенд карьера: то, что раньше было скриптами.
#
# Скрипт отвечает на вопрос «что сделать», роль на вопрос «как должно быть».
# Разница видна на втором прогоне: скрипт делает всё заново, роль сообщает,
# что менять нечего. На площадке с полусотней машин это разница между
# «выкатили» и «выкатили и знаем, что получилось».
#
#   ansible-playbook site.yml                     привести стенд к описанному
#   ansible-playbook site.yml --check --diff      показать, что изменится
#   ansible-playbook site.yml --tags vremya       только часы
#   ansible-playbook site.yml -e nas_pervaya_ustanovka=true   первая сборка
#                                                            хранилища, СТИРАЕТ том
#
# Список машин берётся из вывода terraform: inventory/quarry.py.

- name: Узлы кластера
  hosts: uzly
  become: true
  roles:
    - role: vremya
      tags: [vremya]
    - role: reestr
      tags: [reestr]

- name: Хранилище из двух машин
  hosts: hranilishche
  become: true
  # 🔴 По одной машине за раз. Перезапуск keepalived двигает общий адрес, и
  # одновременная правка обеих машин оставила бы кластер без тома.
  serial: 1
  # Сначала запасная машина, потом главная: так к моменту, когда адрес
  # переедет, принимающая сторона уже обновлена. Обратный порядок означал бы
  # переезд на машину со старыми правилами. Приоритет убывает вместе с именем,
  # поэтому обратная сортировка и даёт «сначала ведомая».
  order: reverse_sorted
  vars:
    # Старшинство при первой сборке: источником данных объявляется машина с
    # наибольшим приоритетом, а не та, что попалась первой.
    nas_prioritet_starshiy: "{{ groups['hranilishche']
      | map('extract', hostvars, 'nas_prioritet') | max }}"
  roles:
    - role: vremya
      tags: [vremya]
    - role: hranilishche
      tags: [hranilishche]
