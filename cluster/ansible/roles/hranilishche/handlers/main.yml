---
# ⚠️ Перезапуск keepalived на главной машине двигает общий адрес: она на
# секунды становится ведомой, том размонтируется и отдача останавливается.
# Поэтому плей идёт по машинам по одной (serial: 1), а сам перезапуск
# случается только при изменившейся конфигурации.
- name: Перезапустить keepalived
  ansible.builtin.systemd_service:
    name: keepalived
    state: restarted

# Экспорты перечитываются без остановки отдачи: смонтированные тома у
# кластера при этом не рвутся.
- name: Перечитать экспорты
  ansible.builtin.command: exportfs -ra
  changed_when: true
  # На ведомой машине служба NFS остановлена намеренно, и это не ошибка.
  failed_when: false

# Правку описания ресурса DRBD подхватывает без остановки репликации: так
# меняют таймауты и скорость досылки на работающей паре. Перезапуск здесь
# был бы разрывом канала, то есть ровно той аварией, от которой защищаемся.
- name: Применить настройки реплики
  ansible.builtin.command: drbdadm adjust quarry
  changed_when: true
  failed_when: false
