---
# Общий адрес, по которому кластер ходит за томами. Про переезд между
# машинами кластеру знать не нужно: адрес один и тот же.
nas_obshchiy_adres: 192.168.200.251
nas_katalog: /srv/quarry-nfs
# ⚠️ 0777 не небрежность. На главной машине это корень смонтированного тома,
# и в него пишут контейнеры кластера со своими идентификаторами, а не root.
# Ужать до 0755 значит остановить базы на следующем запуске.
nas_prava_kataloga: "0777"
nas_disk: /dev/vdb
nas_set: 192.168.200.0/24
nas_interfeys: ens3

# 🔴 Разрушительные шаги выключены по умолчанию.
#
# Сборка метаданных DRBD (`create-md`) и создание файловой системы стирают
# том. На пустых машинах это установка, на работающем хранилище это потеря
# данных всех баз разом. Поэтому первая установка включается явно:
#
#   ansible-playbook site.yml -e nas_pervaya_ustanovka=true
#
# Повторный прогон роли без этого флага настраивает и чинит конфигурацию, но
# к данным не прикасается.
nas_pervaya_ustanovka: false
