# Git-сервер внутри контура.
#
# Почему Gitea, а не GitLab: у заказчика в каждом закрытом контуре разворачивать
# GitLab это отдельный проект с базой, Redis, воркерами и памятью в гигабайтах.
# Здесь нужен ровно git по HTTP, из которого ArgoCD читает манифесты. Gitea это
# один образ и один файл базы на постоянном томе.
#
# Наружу репозиторий не смотрит: NodePort доступен только внутри сети площадки.
apiVersion: v1
kind: Namespace
metadata:
  name: quarry-infra
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: quarry-infra
spec:
  type: NodePort
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30030
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: quarry-infra
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea
  namespace: quarry-infra
spec:
  serviceName: gitea
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: registry.quarry.local:5000/mirror/gitea:1.27.3
          env:
            # База в файле: отдельный PostgreSQL ради одного репозитория с
            # манифестами это лишний узел отказа в контуре.
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__server__ROOT_URL
              value: http://gitea.quarry-infra.svc.cluster.local:3000/
            - name: GITEA__server__DISABLE_SSH
              value: "true"
            # Контур закрытый, но регистрация всё равно ни к чему: учётные
            # записи заводит тот, кто разворачивает.
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__repository__DEFAULT_BRANCH
              value: main
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
