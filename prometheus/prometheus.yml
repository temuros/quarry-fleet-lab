global:
  scrape_interval: 5s
  evaluation_interval: 15s

# Сработавшие правила уходят в Alertmanager: сам Prometheus тревоги не
# рассылает и про их историю ничего не знает.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Счётчики приёмного шлюза: сколько пакетов пришло с бортов, сколько
  # записей, сколько битых сумм. Без них вопрос «данные не идут» не
  # разобрать: непонятно, молчит техника или не работает приём.
  - job_name: egts-gateway
    static_configs:
      - targets: ["egts-gateway:8090"]

  - job_name: quarry-collector
    static_configs:
      - targets: ["collector:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
